name: bot

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install playwright
      - run: playwright install --with-deps chromium
      - run: echo "$SESSION" > session.json
        env:
          SESSION: ${{ secrets.SESSION }}
      - run: python bot.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captures
          path: captures/
          retention-days: 3
